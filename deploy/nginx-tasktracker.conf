# TaskTracker — LAN-only (ADR-0004). Upstream: Caddy from the compose stack
# in ~/proj/AI_Kanban, bound to 127.0.0.1:8081.
#
# Deliberately on a non-obvious port: 80/443 belong to the LiteLLM vhosts and
# 8080 is http-alt, i.e. the first thing any scanner tries.
# Access: http://server-1.lan:27182/ (also works by IP on either interface:
# 192.168.2.156 wired, 192.168.1.55 wifi).
server {
    listen 27182;
    listen [::]:27182;
    server_name _;

    client_max_body_size 10m;

    # ADR-0004: LAN only. Reject anything that is not a private-range client,
    # so an accidental router port-forward cannot expose the tracker.
    allow 127.0.0.0/8;
    allow 192.168.0.0/16;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    deny  all;

    location / {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        # Preserve the browser's port: CSRF compares scheme, host AND port.
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering    off;
    }
}
