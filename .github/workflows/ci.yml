name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tasktracker
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: tasktracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tasktracker -d tasktracker_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://tasktracker:ci-test-only@localhost:5432/tasktracker_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (frozen)
        run: |
          cd backend && uv sync --frozen
          cd ../frontend && npm ci --no-audit --no-fund

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build
        env:
          POSTGRES_PASSWORD: ci-build-placeholder
        run: make build
